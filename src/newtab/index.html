<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Out 2</title>

  <!-- Newsreader for headings/numbers, DM Sans for body text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/dashboard.css">
</head>
<body>
<div class="container">

  <!-- ================================================================
       HEADER — greeting on the left, settings on the right
       ================================================================ -->
  <header>
    <div class="header-left">
      <!-- Filled in by Dashboard#renderHeader -->
      <h1 id="greeting"></h1>
      <div class="date" id="dateDisplay"></div>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="historyBtn" data-action="open-history"
              title="History" aria-label="History">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        </svg>
        <span class="icon-btn-badge" id="historyBadge" style="display:none"></span>
      </button>
      <button class="icon-btn" id="settingsBtn" data-action="open-settings"
              title="Tab Out 2 settings" aria-label="Tab Out 2 settings">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
        </svg>
      </button>
    </div>
  </header>

  <!-- ================================================================
       SEARCH OVERLAY — search across open tabs + closed-tab history.
       Toggled by the configurable shortcut (default Cmd+F on Mac).
       Hidden by default; closed by the X, the backdrop, or Escape.
       See newtab/controller.ts and newtab/dashboard.ts#renderSearchPanel.
       ================================================================ -->
  <div class="search-overlay" id="searchOverlay" style="display:none">
    <div class="search-modal">
      <div class="search-modal-header">
        <input type="text" class="search-input" id="searchInput" placeholder="Search open tabs and history...">
        <button class="icon-btn icon-btn-sm" data-action="close-search" aria-label="Close search" title="Close">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <!-- ================================================================
       HISTORY PANEL — recently closed tabs, opened via the header button.
       Hidden by default; closed by the X, the backdrop, or Escape.
       See newtab/controller.ts and newtab/dashboard.ts#renderHistoryPanel.
       ================================================================ -->
  <div class="history-overlay" id="historyOverlay" style="display:none">
    <div class="history-modal">
      <div class="history-modal-header">
        <h2>History</h2>
        <div class="history-modal-count" id="historyCount"></div>
        <div class="history-modal-actions">
          <button class="btn-ghost-sm" data-action="clear-history">Clear all</button>
          <button class="icon-btn icon-btn-sm" data-action="close-history" aria-label="Close history" title="Close">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>
      <input type="text" class="history-search" id="historySearch" placeholder="Search closed tabs...">
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <!-- ================================================================
       TAB SORT BANNER — shown when the tab bar order differs from this view.
       (The old "Close extras" banner is gone: extra Tab Out 2 pages are now
       closed automatically when a new one opens. See newtab/singleton.ts)
       ================================================================ -->
  <div class="tab-cleanup-banner tab-sort-banner" id="tabSortBanner" style="display:none">
    <div class="tab-cleanup-left">
      <div class="tab-cleanup-icon tab-sort-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 7.5 7.5 3m0 0L12 7.5M7.5 3v13.5m13.5 0L16.5 21m0 0L12 16.5m4.5 4.5V7.5" />
        </svg>
      </div>
      <div class="tab-cleanup-text">
        Your tabs are out of order. Sort them to match this view?
      </div>
    </div>
    <button class="tab-cleanup-btn tab-sort-btn" data-action="sort-tabs">Sort tabs</button>
  </div>

  <!-- ================================================================
       MAIN CONTENT — left: open tabs, right: saved for later
       The right column only appears when it has items.
       ================================================================ -->
  <div class="dashboard-columns" id="dashboardColumns">

    <!-- LEFT: open tabs -->
    <div class="active-section" id="openTabsSection" style="display:none">
      <div class="section-header">
        <h2 id="openTabsSectionTitle">Open tabs</h2>
        <div class="section-line"></div>
        <div class="section-count" id="openTabsSectionCount"></div>
      </div>
      <div class="missions" id="openTabsMissions"></div>
    </div>

    <!-- RIGHT: saved for later checklist -->
    <div class="deferred-column" id="deferredColumn" style="display:none">
      <div class="section-header">
        <h2>Saved for later</h2>
        <div class="section-line"></div>
        <div class="section-count" id="deferredCount"></div>
      </div>

      <div class="deferred-list" id="deferredList"></div>

      <div class="deferred-empty" id="deferredEmpty" style="display:none">
        Nothing saved. Living in the moment.
      </div>

      <div class="deferred-archive" id="deferredArchive" style="display:none">
        <button class="archive-toggle" id="archiveToggle">
          <svg class="archive-chevron" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" /></svg>
          Archive
          <span class="archive-count" id="archiveCount"></span>
        </button>
        <div class="archive-body" id="archiveBody" style="display:none">
          <input type="text" class="archive-search" id="archiveSearch" placeholder="Search archived tabs...">
          <div class="archive-list" id="archiveList"></div>
        </div>
      </div>
    </div>

  </div><!-- end .dashboard-columns -->

  <!-- ================================================================
       FOOTER — global stats
       ================================================================ -->
  <footer>
    <div class="footer-stats">
      <div class="stat">
        <div class="stat-num" id="statTabs">—</div>
        <div class="stat-label">Open tabs</div>
      </div>
    </div>
    <div class="last-refresh">
      <span class="footer-credit">
        <a href="https://github.com/lastorder/tab-out" target="_blank" rel="noopener">Tab Out 2</a>
        by <a href="https://github.com/lastorder" target="_blank" rel="noopener">lastorder</a>
      </span>
    </div>
  </footer>

</div><!-- end .container -->

<!-- Toast — floats above everything, used for action confirmations -->
<div class="toast" id="toast">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
  </svg>
  <span id="toastText"></span>
</div>

<script src="newtab.js"></script>
</body>
</html>
